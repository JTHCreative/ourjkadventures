<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reset your password. j+k adventures</title>
<meta name="description" content="choose a new password for your j+k adventures account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<meta name="robots" content="noindex">
</head>
<body data-account-page="reset">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="jka-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
  <filter id="jka-rough-fine" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
</svg>
<header class="site-header">
  <div class="wrap">
    <a class="logo-link" href="index.html" aria-label="j+k adventures, home"><img class="logo" src="assets/img/logo.svg" width="400" height="220" alt="j+k adventures"></a>
    <nav class="nav" aria-label="main">
      <a href="index.html">home</a>
      <a href="about.html">about us</a>
      <a href="shop.html">shop</a>
      <a href="contact.html">contact</a>
      <a href="account.html" data-account-link>sign in</a>
      <button class="cart-btn" type="button" data-cart aria-label="open your bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" data-cart-count hidden>0</span>
      </button>
    </nav>
  </div>
</header>
<main>

<section class="section">
  <div class="wrap narrow center">
    <p class="eyebrow">your account</p>
    <h1 class="display" style="margin-top:var(--space-2)">new password.</h1>
    <p class="body-lg muted" style="margin-top:var(--space-4)">tell us your email and we will send you a link to choose a new password.</p>
  </div>
  <div class="wrap auth" style="margin-top:var(--space-6)">
    <div class="card clean">
      <form class="form" id="reset-form" novalidate>
        <div class="field">
          <label for="email">email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <p class="form-msg" role="status" hidden></p>
        <button class="jka-btn" type="submit">send me a link</button>
      </form>
      <div class="auth-links">
        <a href="sign-in.html">back to sign in</a>
      </div>
    </div>
  </div>
</section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <div class="links">
      <a href="shop.html">shop</a>
      <a href="about.html">about us</a>
      <a href="contact.html">contact</a>
      <a href="https://www.instagram.com/ourjkadventures/" target="_blank" rel="noopener">instagram</a>
      <a href="mailto:support@ourjkadventures.com">email</a>
      <a href="privacy.html">privacy</a>
    </div>
    <p class="caption">&copy; 2026 j+k adventures.</p>
  </div>
</footer>
<script src="assets/app.js"></script>
<script type="module" src="assets/account.js"></script>
</body>
</html>
